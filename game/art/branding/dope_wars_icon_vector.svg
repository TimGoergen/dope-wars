<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <!-- Neon Outer Squircle Rim Glow -->
    <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.7"/>
    </linearGradient>
    <!-- Deep Comic Drop Shadow for Crossing Layer -->
    <filter id="pillShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
    <filter id="needleShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- 1. APP ICON SQUIRCLE BASE -->
  <rect x="16" y="16" width="480" height="480" rx="106" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="6"/>
  <rect x="22" y="22" width="468" height="468" rx="100" fill="none" stroke="url(#rimGrad)" stroke-width="4"/>

  <!-- Subtle Radial Spotlight Behind Cross -->
  <circle cx="256" cy="256" r="170" fill="#38BDF8" opacity="0.07"/>

  <!-- ============================================================ -->
  <!-- 2. HYPODERMIC NEEDLE / SYRINGE (Angled at 45° across \ diagonal) -->
  <!-- ============================================================ -->
  <g transform="translate(256, 256) rotate(45)" filter="url(#needleShadow)">

    <!-- Steel Needle Shaft & Point -->
    <!-- Heavy Black Inked Contour -->
    <line x1="0" y1="-215" x2="0" y2="-95" stroke="#000000" stroke-width="18" stroke-linecap="round"/>
    <!-- Polished Steel Needle Body -->
    <line x1="0" y1="-215" x2="0" y2="-95" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round"/>
    <line x1="-2" y1="-215" x2="-2" y2="-95" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

    <!-- Single Golden Droplet at Needle Tip -->
    <path d="M 0 -228 C -6 -222 -8 -215 -8 -211 A 8 8 0 0 0 8 -211 C 8 -215 6 -222 0 -228 Z"
          fill="#F59E0B" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="-2.5" cy="-211" r="2.2" fill="#FEF08A"/>

    <!-- Plunger Shaft (Extending from bottom of barrel) -->
    <rect x="-9" y="90" width="18" height="95" fill="#94A3B8" stroke="#000000" stroke-width="12" stroke-linejoin="round"/>
    <rect x="-4" y="94" width="8" height="85" fill="#CBD5E1"/>

    <!-- Plunger Thumb Press Disc -->
    <rect x="-38" y="180" width="76" height="22" rx="6" fill="#E2E8F0" stroke="#000000" stroke-width="12" stroke-linejoin="round"/>
    <rect x="-32" y="184" width="64" height="6" rx="2" fill="#FFFFFF"/>

    <!-- Barrel Finger Grip Flange -->
    <rect x="-50" y="86" width="100" height="22" rx="5" fill="#CBD5E1" stroke="#000000" stroke-width="14" stroke-linejoin="round"/>
    <rect x="-42" y="90" width="84" height="6" rx="2" fill="#FFFFFF"/>

    <!-- Syringe Glass Barrel Body -->
    <!-- Heavy Black Inked Outer Casing -->
    <rect x="-34" y="-95" width="68" height="185" rx="10" fill="#000000" stroke="#000000" stroke-width="14" stroke-linejoin="round"/>
    <!-- Dark Glass Core Backing -->
    <rect x="-28" y="-90" width="56" height="175" rx="6" fill="#0B132B"/>

    <!-- Amber Liquid Fill (Heroin / Substance Solution) -->
    <rect x="-26" y="-85" width="52" height="125" fill="#B45309"/>
    <!-- Liquid Highlight Plane -->
    <rect x="-14" y="-85" width="40" height="125" fill="#D97706"/>
    <rect x="2" y="-85" width="24" height="125" fill="#F59E0B"/>
    <!-- Liquid Top Meniscus -->
    <ellipse cx="0" cy="-85" rx="26" ry="6" fill="#FDE047"/>

    <!-- Black Rubber Plunger Head Seal inside barrel -->
    <rect x="-26" y="40" width="52" height="26" rx="3" fill="#020617"/>
    <line x1="-24" y1="48" x2="24" y2="48" stroke="#334155" stroke-width="3"/>
    <line x1="-24" y1="58" x2="24" y2="58" stroke="#334155" stroke-width="3"/>

    <!-- CC / Measurement Graduation Tick Marks -->
    <!-- Major ticks -->
    <line x1="-24" y1="-65" x2="-6" y2="-65" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="-24" y1="-40" x2="-6" y2="-40" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="-24" y1="-15" x2="-6" y2="-15" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="-24" y1="10" x2="-6" y2="10" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="-24" y1="35" x2="-6" y2="35" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Minor ticks -->
    <line x1="-24" y1="-52" x2="-14" y2="-52" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="-24" y1="-27" x2="-14" y2="-27" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="-24" y1="-2" x2="-14" y2="-2" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="-24" y1="23" x2="-14" y2="23" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

    <!-- Glass Specular Highlight Streak -->
    <rect x="14" y="-84" width="8" height="162" rx="4" fill="#FFFFFF" opacity="0.88"/>
    <circle cx="18" cy="83" r="3.5" fill="#FFFFFF" opacity="0.88"/>

    <!-- Stainless Needle Hub / Luer-Lock Collar -->
    <polygon points="-16,-95 16,-95 12,-118 -12,-118" fill="#94A3B8" stroke="#000000" stroke-width="12" stroke-linejoin="round"/>
    <polygon points="-12,-97 12,-97 9,-116 -9,-116" fill="#CBD5E1"/>
  </g>

  <!-- ============================================================ -->
  <!-- 3. TWO-TONE PRESCRIPTION CAPSULE (Angled at -45° across / diagonal) -->
  <!-- Sits across the needle forming the iconic "X" -->
  <!-- ============================================================ -->
  <g transform="translate(256, 256) rotate(-45)" filter="url(#pillShadow)">

    <!-- Heavy Black Comic Ink Border for Entire Capsule -->
    <rect x="-52" y="-165" width="104" height="330" rx="52" fill="#000000" stroke="#000000" stroke-width="18" stroke-linejoin="round"/>

    <!-- === TOP HALF: ORANGE HUSTLER CAP === -->
    <g>
      <!-- Base Orange Fill -->
      <path d="M -48 0 V -113 A 48 48 0 0 1 48 -113 V 0 Z" fill="#FF6B00"/>

      <!-- GTA Hard Cel-Shade Underbelly (Dark Shadow Plane) -->
      <path d="M -48 0 V -113 A 48 48 0 0 1 0 -161 V 0 Z" fill="#C2410C"/>
      <path d="M -48 0 V -113 A 48 48 0 0 1 -20 -157 V 0 Z" fill="#9A3412"/>

      <!-- Right Light Face -->
      <path d="M 12 -160 A 48 48 0 0 1 48 -113 V 0 H 12 Z" fill="#FB923C"/>

      <!-- Comic White Highlight Slash -->
      <rect x="20" y="-142" width="12" height="110" rx="6" fill="#FFFFFF" opacity="0.92"/>
      <circle cx="26" cy="-18" r="5" fill="#FFFFFF" opacity="0.92"/>
    </g>

    <!-- === BOTTOM HALF: ELECTRIC CYAN ICE CAP === -->
    <g>
      <!-- Base Cyan Fill -->
      <path d="M -48 0 V 113 A 48 48 0 0 0 48 113 V 0 Z" fill="#00F0FF"/>

      <!-- GTA Hard Cel-Shade Underbelly (Dark Blue Shadow Plane) -->
      <path d="M -48 0 V 113 A 48 48 0 0 0 0 161 V 0 Z" fill="#0284C7"/>
      <path d="M -48 0 V 113 A 48 48 0 0 0 -20 157 V 0 Z" fill="#0369A1"/>

      <!-- Right Light Face -->
      <path d="M 12 160 A 48 48 0 0 0 48 113 V 0 H 12 Z" fill="#38BDF8"/>

      <!-- Comic White Highlight Slash -->
      <rect x="20" y="28" width="12" height="105" rx="6" fill="#FFFFFF" opacity="0.92"/>
      <circle cx="26" cy="146" r="5" fill="#FFFFFF" opacity="0.92"/>
    </g>

    <!-- Center Seam Gold Band -->
    <rect x="-52" y="-10" width="104" height="20" rx="4" fill="#FACC15" stroke="#000000" stroke-width="4"/>
    <rect x="-48" y="-7" width="96" height="6" rx="2" fill="#FEF08A"/>
    <rect x="-48" y="3" width="96" height="5" rx="1" fill="#CA8A04"/>
  </g>

  <!-- ============================================================ -->
  <!-- 4. GTA COMIC STARBURST GLINTS (Four-point vector sparkles)   -->
  <!-- ============================================================ -->
  <!-- Glint at Needle Tip (Upper-Right quadrant) -->
  <g transform="translate(104, 104) scale(1.1)">
    <polygon points="0,-28 7,-7 28,0 7,7 0,28 -7,7 -28,0 -7,-7" fill="#FACC15" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
  </g>

  <!-- Glint at Orange Pill Cap (Upper-Left quadrant) -->
  <g transform="translate(372, 140) scale(0.9)">
    <polygon points="0,-26 6,-6 26,0 6,6 0,26 -6,6 -26,0 -6,-6" fill="#FACC15" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="4.5" fill="#FFFFFF"/>
  </g>

  <!-- Glint at Cyan Pill Base (Bottom-Right quadrant) -->
  <g transform="translate(140, 372) scale(0.8)">
    <polygon points="0,-24 5,-5 24,0 5,5 0,24 -5,5 -24,0 -5,-5" fill="#FACC15" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Glint at Plunger Disc (Bottom-Left quadrant) -->
  <g transform="translate(408, 408) scale(0.75)">
    <polygon points="0,-22 5,-5 22,0 5,5 0,22 -5,5 -22,0 -5,-5" fill="#FACC15" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"/>
  </g>

</svg>
