<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <!-- Cyan Rim Glow -->
    <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- 1. Squircle App Icon Base -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bgGrad)" stroke="#1F2937" stroke-width="6"/>
  <rect x="22" y="22" width="468" height="468" rx="98" fill="none" stroke="url(#rimGrad)" stroke-width="4"/>

  <!-- 2. Main Icon Group with Drop Shadow -->
  <g filter="url(#dropShadow)">

    <!-- BACK CRYSTAL SHARD (Top Right) -->
    <g transform="translate(350, 115) rotate(25) scale(0.85)">
      <!-- Base Shadow -->
      <polygon points="0,-40 32,-10 24,40 -24,40 -32,-10" fill="#0C4A6E" stroke="#000000" stroke-width="10" stroke-linejoin="round"/>
      <!-- Facets -->
      <polygon points="0,-40 32,-10 0,38" fill="#38BDF8"/>
      <polygon points="0,-40 -32,-10 0,38" fill="#7DD3FC"/>
      <polygon points="0,-40 0,38 24,40" fill="#0284C7"/>
      <polygon points="0,-40 0,38 -24,40" fill="#0369A1"/>
      <line x1="0" y1="-36" x2="0" y2="34" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- FLOATING COMIC CASH NOTES / DOLLAR SIGNS -->
    <!-- Large Center-Left Green Dollar Sign -->
    <g transform="translate(230, 175) rotate(-12)">
      <!-- Heavy Black Inked Backing -->
      <path d="M 0 -52 C 28 -52 42 -36 42 -18 C 42 16 8 20 4 28 C 0 36 28 36 34 24 M -6 -52 C -30 -52 -40 -34 -40 -16 C -40 18 -6 22 -2 30 C 2 38 -26 38 -32 26"
            stroke="#000000" stroke-width="26" stroke-linecap="round" fill="none"/>
      <line x1="0" y1="-64" x2="0" y2="64" stroke="#000000" stroke-width="26" stroke-linecap="round"/>
      
      <!-- Saturated Cel-Shaded Green Core -->
      <line x1="0" y1="-64" x2="0" y2="64" stroke="#15803D" stroke-width="16" stroke-linecap="round"/>
      <line x1="-3" y1="-64" x2="-3" y2="64" stroke="#22C55E" stroke-width="10" stroke-linecap="round"/>
      <path d="M 0 -52 C 26 -52 38 -36 38 -18 C 38 14 6 18 2 28 C -2 38 24 38 32 24"
            stroke="#15803D" stroke-width="16" stroke-linecap="round" fill="none"/>
      <path d="M 0 -52 C 26 -52 38 -36 38 -18 C 38 14 6 18 2 28 C -2 38 24 38 32 24"
            stroke="#4ADE80" stroke-width="10" stroke-linecap="round" fill="none"/>
      <path d="M -4 -52 C -28 -52 -36 -34 -36 -16 C -36 18 -4 22 0 30 C 4 38 -22 38 -30 26"
            stroke="#15803D" stroke-width="16" stroke-linecap="round" fill="none"/>
      <path d="M -4 -52 C -28 -52 -36 -34 -36 -16 C -36 18 -4 22 0 30 C 4 38 -22 38 -30 26"
            stroke="#4ADE80" stroke-width="10" stroke-linecap="round" fill="none"/>
      <!-- Comic White Highlight -->
      <path d="M -2 -48 C 16 -48 24 -38 24 -24" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none"/>
      <circle cx="-1" cy="52" r="3" fill="#FFFFFF"/>
    </g>

    <!-- Secondary Smaller Dollar Sign (Upper Right) -->
    <g transform="translate(305, 140) rotate(18) scale(0.68)">
      <line x1="0" y1="-50" x2="0" y2="50" stroke="#000000" stroke-width="22" stroke-linecap="round"/>
      <path d="M 0 -40 C 22 -40 32 -26 32 -12 C 32 12 4 16 0 24 C -4 32 20 32 26 20 M -4 -40 C -22 -40 -30 -26 -30 -12 C -30 12 -4 16 0 24 C 4 32 -18 32 -24 20"
            stroke="#000000" stroke-width="22" stroke-linecap="round" fill="none"/>
      <line x1="0" y1="-50" x2="0" y2="50" stroke="#16A34A" stroke-width="12" stroke-linecap="round"/>
      <line x1="-2" y1="-50" x2="-2" y2="50" stroke="#86EFAC" stroke-width="6" stroke-linecap="round"/>
      <path d="M 0 -40 C 22 -40 32 -26 32 -12 C 32 12 4 16 0 24 C -4 32 20 32 26 20"
            stroke="#22C55E" stroke-width="12" stroke-linecap="round" fill="none"/>
      <path d="M -4 -40 C -22 -40 -30 -26 -30 -12 C -30 12 -4 16 0 24 C 4 32 -18 32 -24 20"
            stroke="#22C55E" stroke-width="12" stroke-linecap="round" fill="none"/>
      <path d="M -2 -38 C 12 -38 20 -28 20 -16" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none"/>
    </g>

    <!-- FRONT CRYSTAL SHARD (Bottom Center-Left) -->
    <g transform="translate(180, 240) rotate(-35) scale(0.9)">
      <polygon points="0,-44 34,-12 26,44 -26,44 -34,-12" fill="#082F49" stroke="#000000" stroke-width="10" stroke-linejoin="round"/>
      <polygon points="0,-44 34,-12 0,42" fill="#00D8F6"/>
      <polygon points="0,-44 -34,-12 0,42" fill="#A5F3FC"/>
      <polygon points="0,-44 0,42 26,44" fill="#0284C7"/>
      <polygon points="0,-44 0,42 -26,44" fill="#075985"/>
      <line x1="-2" y1="-38" x2="-2" y2="36" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- 3. CRACKED TWO-TONE CAPSULE (THE HERO PIECE) -->
    <!-- Tilted -38 degrees for high dynamic tension -->
    <g transform="rotate(-38 256 280)">

      <!-- === LEFT HALF: ORANGE HUSTLER CAP === -->
      <!-- Shifted backward/left along capsule axis -->
      <g transform="translate(-24, 0)">
        <!-- Solid Black Comic Ink Boundary -->
        <path d="M 120 220 
                 A 60 60 0 0 1 240 220 
                 L 240 270 
                 L 225 285 
                 L 238 300 
                 L 220 315 
                 L 120 315 
                 Z" 
              fill="#000000" stroke="#000000" stroke-width="16" stroke-linejoin="round"/>
        
        <!-- Base Saturated Orange -->
        <path d="M 120 220 
                 A 60 60 0 0 1 240 220 
                 L 240 270 
                 L 225 285 
                 L 238 300 
                 L 220 315 
                 L 120 315 
                 Z" 
              fill="#FF6B00"/>

        <!-- GTA Hard Cel-Shade Underbelly (Dark Shadow Plane) -->
        <path d="M 120 220 
                 A 60 60 0 0 1 180 160
                 L 180 315
                 L 120 315
                 Z" 
              fill="#9A3412"/>
        <path d="M 140 220 
                 A 60 60 0 0 1 195 165
                 L 195 315
                 L 140 315
                 Z" 
              fill="#C2410C"/>

        <!-- Pill Top Light Plane -->
        <path d="M 210 170 
                 A 60 60 0 0 1 240 220 
                 L 240 270 
                 L 225 285 
                 L 238 300 
                 L 220 315 
                 L 210 315 
                 Z" 
              fill="#F97316"/>

        <!-- Inner Fracture Highlight -->
        <polygon points="225,285 238,300 220,315 210,315 220,295" fill="#FDBA74"/>

        <!-- Sharp White Comic Specular Glint Slash -->
        <rect x="180" y="172" width="16" height="85" rx="8" fill="#FFFFFF" opacity="0.92" transform="rotate(-5 188 214)"/>
        <circle cx="193" cy="285" r="7" fill="#FFFFFF" opacity="0.92"/>
      </g>

      <!-- === RIGHT HALF: CYAN ICE CAP === -->
      <!-- Shifted forward/right along capsule axis -->
      <g transform="translate(26, 0)">
        <!-- Solid Black Comic Ink Boundary -->
        <path d="M 272 220 
                 L 392 220 
                 A 60 60 0 0 1 272 220 
                 L 392 220
                 A 60 60 0 0 1 272 220
                 Z" fill="none"/>
        <path d="M 272 220 
                 L 254 235 
                 L 270 252 
                 L 252 270 
                 L 252 315 
                 L 372 315 
                 A 60 60 0 0 0 372 195 
                 L 272 195 
                 Z" 
              fill="#000000" stroke="#000000" stroke-width="16" stroke-linejoin="round"/>

        <!-- Base Vibrant Cyan -->
        <path d="M 272 220 
                 L 254 235 
                 L 270 252 
                 L 252 270 
                 L 252 315 
                 L 372 315 
                 A 60 60 0 0 0 372 195 
                 L 272 195 
                 Z" 
              fill="#00F0FF"/>

        <!-- GTA Hard Cel-Shade Underbelly (Dark Cyan/Blue Shadow Plane) -->
        <path d="M 252 270 
                 L 252 315 
                 L 372 315 
                 A 60 60 0 0 0 432 255 
                 L 310 255 
                 Z" 
              fill="#0369A1"/>
        <path d="M 252 260 
                 L 252 315 
                 L 372 315 
                 A 60 60 0 0 0 415 235 
                 L 290 235 
                 Z" 
              fill="#0284C7"/>

        <!-- Pill Top Light Plane -->
        <path d="M 272 195 
                 L 372 195 
                 A 60 60 0 0 1 425 225 
                 L 272 225 
                 Z" 
              fill="#38BDF8"/>

        <!-- Inner Fracture Highlight -->
        <polygon points="272,220 254,235 270,252 252,270 264,270 280,245" fill="#E0F2FE"/>

        <!-- Sharp White Comic Specular Glint Slash -->
        <rect x="305" y="202" width="16" height="75" rx="8" fill="#FFFFFF" opacity="0.92" transform="rotate(-5 313 239)"/>
        <circle cx="372" cy="226" r="7" fill="#FFFFFF" opacity="0.92"/>
      </g>

      <!-- Center Crack Energy Spark -->
      <polygon points="236,255 264,242 250,265 278,252 248,278 258,268" fill="#FACC15" stroke="#FFFFFF" stroke-width="2"/>
    </g>

    <!-- 4. GOLD GTA COMIC SPARKLE STARS -->
    <!-- Upper-Left Glint Star -->
    <g transform="translate(108, 140)">
      <polygon points="0,-28 7,-7 28,0 7,7 0,28 -7,7 -28,0 -7,-7" fill="#FACC15" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
      <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
    </g>

    <!-- Bottom-Right Glint Star -->
    <g transform="translate(415, 385) scale(0.75)">
      <polygon points="0,-26 6,-6 26,0 6,6 0,26 -6,6 -26,0 -6,-6" fill="#FACC15" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
      <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
    </g>

    <!-- Small Upper-Right Glint Star -->
    <g transform="translate(425, 95) scale(0.55)">
      <polygon points="0,-24 5,-5 24,0 5,5 0,24 -5,5 -24,0 -5,-5" fill="#FACC15" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
      <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
    </g>

  </g>
</svg>
